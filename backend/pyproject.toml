[project]
name = "backend"
version = "0.1.0"
description = "Unified FastAPI Backend for AI Interviewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.30.0",
    "django>=5.1.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "chromadb>=0.5.15",
    "langchain-chroma>=0.1.4",
    "firebase-admin>=6.5.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools]
packages = ["app"]
